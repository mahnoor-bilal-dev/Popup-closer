<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legitimate Fullscreen Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }

        .content {
            padding: 20px;
        }

        /* Simulating a legitimate fullscreen video player */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999; /* High z-index typical of fullscreen media */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #222;
        }

        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: flex;
            gap: 15px;
            pointer-events: auto; /* Controls should be clickable */
        }

        .video-controls button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .close-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Page Content Behind Video</h1>
        <p>This is some standard page content that is currently obscured by the fullscreen video player.</p>
    </div>

    <!-- The legitimate fullscreen video player -->
    <div class="video-container" id="fullscreen-video">
        <div class="video-element" style="display: flex; align-items: center; justify-content: center; color: #666;">
            [Video Content Placeholder]
        </div>
        
        <button class="close-fullscreen">Exit Fullscreen</button>

        <div class="video-controls">
            <button>Play</button>
            <button>Pause</button>
            <button>Volume</button>
        </div>
    </div>

</body>
</html>
